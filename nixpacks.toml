# ==============================================================================
# Nixpacks Configuration for NAAP Library
# PHP 8.3 + Node 22 + Python 3 (Face Engine) + Nginx + Supervisord
# ==============================================================================

[phases.setup]
nixPkgs = [
    # PHP 8.3 & Extensions required by Laravel 11/12 & packages
    "php83",
    "php83Packages.composer",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.curl",
    "php83Extensions.zip",
    "php83Extensions.gd",
    "php83Extensions.bcmath",
    "php83Extensions.exif",
    "php83Extensions.intl",
    
    # Node.js 22 (required for Vite 8 / Rolldown node >= 22.12.0)
    "nodejs_22",
    
    # Python 3 & Native C++ Libraries for Face Recognition Engine (NumPy C-extensions)
    "python3",
    "python3Packages.pip",
    "python3Packages.virtualenv",
    "python3Packages.numpy",
    "stdenv.cc.cc.lib",
    "zlib",
    
    # Web Server & Process Supervisor
    "nginx",
    "python3Packages.supervisor",
    "bash"
]
nixLibs = ["stdenv.cc.cc.lib", "zlib"]
aptPkgs = ["libstdc++6"]

[phases.install]
cmds = [
    # 1. Install Composer dependencies
    "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev",
    
    # 2. Install Node dependencies with robust network retry and lockfile support
    "npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 || npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000",
    
    # 3. Create virtual environment with system site packages and install Face Engine requirements
    "python3 -m venv --system-site-packages face_engine/venv",
    "face_engine/venv/bin/pip install --upgrade pip",
    "face_engine/venv/bin/pip install -r face_engine/requirements.txt"
]

[phases.build]
cmds = [
    # Compile frontend assets with Vite
    "npm run build"
]

[start]
cmd = "bash ./scripts/start-production.sh"
